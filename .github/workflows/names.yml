# Person names on Linux with the real model (Phase 6c, ADR-036): the names
# tests and the span comparison against the baseline of the runner's CPU
# model (eval/names-baselines.json). Manual (option E4), plus a daily run
# that is temporary: it exists to collect counted runs on as many runner
# CPUs as possible for ADR-036's stopping rule, which decides whether this
# ever runs on every push (E1). Every run prints the runner's CPU model.
name: Names

on:
  # Daily, temporary (ADR-036): counted runs for the stopping rule.
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      onnxruntime-install:
        description: >-
          ONNXRUNTIME_NODE_INSTALL at npm ci: "skip" is CI's setting; "default"
          lets onnxruntime-node's install script fetch what it asks for, to
          measure that download (ADR-036)
        type: choice
        options: [skip, default]
        default: skip

permissions:
  contents: read

jobs:
  names:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # A scheduled run has no inputs: it installs with skip, CI's setting, so
      # that it counts under the stopping rule.
      # The resolved mode is printed first, so every run records its own
      # input: three runs' inputs could not be recovered from their logs
      # afterwards (testing guide, Phase 6c).
      - name: Install
        env:
          MODE: ${{ inputs.onnxruntime-install || 'skip' }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "onnxruntime-install for this run: $MODE (started by: $EVENT)"
          if [ "$MODE" = skip ]; then ONNXRUNTIME_NODE_INSTALL=skip npm ci; else npm ci; fi

      # ADR-036's first check on Linux: the CPU runtime's two files are in the
      # package, and what else the install put there (CUDA libraries only
      # without the skip).
      - name: What the install put on disk, and on which CPU
        run: |
          grep -m1 'model name' /proc/cpuinfo
          nproc
          du -sb node_modules/onnxruntime-node
          ls -l node_modules/onnxruntime-node/bin/napi-v6/linux/x64/
          find node_modules/onnxruntime-node \( -iname '*cuda*' -o -iname '*tensorrt*' \) -exec ls -l {} +

      # The model (178.5 MB) by the cache, keyed by the file that pins it
      # (src/gateway/name-model.ts: repository, commit, each file's SHA-256),
      # with the pinned download as the fallback (options M2 and M1, ADR-036).
      # A corrupt cache can fail this job but cannot produce wrong spans:
      # fetch:model hashes every file it keeps, and the gateway hashes them
      # again before it loads the model, refusing to start on any mismatch.
      - name: Restore the model
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: name-model-${{ hashFiles('src/gateway/name-model.ts') }}

      # Keeps each file already in place and right (size and SHA-256 checked),
      # downloads the rest from the pinned commit, refuses any mismatch.
      - name: Fetch or check the model
        run: npm run fetch:model

      # Saved only once the files are verified, and before the comparison, so
      # that a DIFFERENT result (a result, not a failure of the files) does
      # not leave the next run downloading again.
      - name: Save the model
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: name-model-${{ hashFiles('src/gateway/name-model.ts') }}

      # ADR-036's second check: an inference session on B is created and runs.
      - name: Names tests on the real model
        run: npm run test:names

      # The pre-registered comparison (ADR-036), against the baseline of this
      # runner's CPU model, the messages put through twice (C1 and C3). Exit 1:
      # DIFFERENT from this CPU's baseline, or the two passes disagree, a
      # result to report, not to fix. A CPU with no baseline passes with a
      # warning; its baseline needs a human commit, from the result file.
      - name: Names through the gateway, against this CPU's baseline
        run: npm run eval:names

      # Hashes, counts and the machine only, never a text: the record for the
      # stopping rule, and a new CPU's baseline once a human commits it.
      - name: Keep the names result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: names-result
          path: names-result.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Keep the machine samples
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: machine-samples
          path: .machine-samples/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
